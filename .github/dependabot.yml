version: 2
updates:
  # npm: VS Code extension (root)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Toronto
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
      llm-providers:
        patterns:
          - "openai"
          - "@anthropic-ai/*"
          - "multi-llm-ts"
      security:
        patterns:
          - "serialize-javascript"
          - "diff"
          - "esbuild"
    ignore:
      # Pin Node typings to the runtime VS Code ships with
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Pin VS Code typings to engines.vscode -- bump manually when the engine moves
      - dependency-name: "@types/vscode"

  # npm: MCP server
  - package-ecosystem: npm
    directory: /mcp-server
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Toronto
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - mcp
    commit-message:
      prefix: chore(deps-mcp)
      prefix-development: chore(deps-mcp-dev)
      include: scope
    groups:
      mcp-dependencies:
        patterns:
          - "*"

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Toronto
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
      include: scope
    groups:
      workflow-actions:
        patterns:
          - "*"
